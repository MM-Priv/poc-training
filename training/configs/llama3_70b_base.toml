# TorchTitan base config — Llama 3.1 70B on 2 nodes × 8 H200 = 16 GPUs.
# Only FSDP FULL (exp4a) and TP+PP (exp3) are known-viable at 70B on this
# topology; HSDP and SHARD_GRAD_OP exceed the 141 GB per-GPU budget.
# Per-experiment parallelism is overridden via --parallelism.* CLI flags.

[job]
dump_folder = "/mnt/data/poc-training/training/results/torchtitan"
description = "Llama 3.1 70B PoC"

[profiling]
enable_profiling = false

[metrics]
log_freq = 10
enable_tensorboard = true
save_tb_folder = "tb"

[model]
name = "llama3"
flavor = "70B"
hf_assets_path = "/mnt/data/poc-training/assets/hf/llama-3.1-tokenizer"

[optimizer]
name = "AdamW"
lr = 1.5e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 12

[training]
local_batch_size = 1
seq_len = 4096
max_norm = 1.0
steps = 50
dataset = "fineweb_edu"  # registered in training/titan_launcher.py (local hf_cache, non-streaming)

[parallelism]
# Defaults; each sbatch overrides these on the CLI.
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1      # -1 = auto-fill remaining world
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "full"  # recompute every transformer block during backward

[compile]
enable = false
